name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and Push Docker Image
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR
        working-directory: ./backend
        run: mvn package -DskipTests -B

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event.inputs.environment == 'staging' || github.event_name == 'release'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      # 真实 SSH 部署 (默认方案, 贴合本仓 docker-compose.yml)。未配 secrets.STAGING_HOST 时优雅跳过
      # (warning 不硬失败); 在 repo Settings→Environments→staging 配齐 secret 即自动启用 (见
      # docs/deployment/cd-secrets.md)。若用 k8s/webhook, 替换下方 ssh-action 步。
      - name: Check staging deploy config
        id: cfg
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -n "$HOST" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_HOST 未配置 → 跳过 staging 部署。配 secrets (见 docs/deployment/cd-secrets.md) 即自动真部署。"
          fi
      - name: Deploy to staging via SSH
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/student-management
            docker compose pull app && docker compose up -d --no-deps app
            docker image prune -f

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-image, deploy-staging]
    if: github.event.inputs.environment == 'production' || github.event_name == 'release'
    environment:
      name: production
      url: https://example.com

    steps:
      # 真实 SSH 部署 + 健康检查 + 失败回滚。未配 secrets.PRODUCTION_HOST 时优雅跳过 (见上注释)。
      - name: Check production deploy config
        id: cfg
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          if [ -n "$HOST" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PRODUCTION_HOST 未配置 → 跳过 production 部署。配 secrets (见 docs/deployment/cd-secrets.md) 即自动真部署。"
          fi
      - name: Deploy to production via SSH
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/student-management
            docker compose pull app && docker compose up -d --no-deps app
            docker image prune -f

      - name: Health check
        if: steps.cfg.outputs.ready == 'true'
        env:
          URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::warning::PRODUCTION_HEALTH_URL 未配置, 跳过健康检查"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL" | grep -q '"status":"UP"'; then echo "✓ health UP"; exit 0; fi
            echo "等待健康检查 ($i/6)..."; sleep 10
          done
          echo "::error::生产健康检查失败"; exit 1

      - name: Rollback on failure
        if: failure() && steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/student-management
            # 回滚到上一个镜像: compose 文件应固定用 :latest 或上一 digest; 简化版重启上次容器
            docker compose rollback app 2>/dev/null || docker compose up -d --no-deps app
            echo "::warning::已尝试回滚 — 请人工核实生产状态"
